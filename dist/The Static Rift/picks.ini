; My Picks - The Static Rift (Project Kaos-Byte4.1.0v)
; In the full-screen menu, press R3 (click the right stick) to go from ALL to MY PICKS. My Picks
; shows the roster (section) of the game you're playing first, then the earlier games' rosters,
; newest game first: in Giants, the Giants roster then the Spyro's Adventure one; in Imaginators,
; Imaginators, SuperChargers, Trap Team, Swap Force, Giants, then Spyro's Adventure. Each roster
; is sorted like ALL (gimmick Skylanders, Skylanders, ... by element, then name). Each name
; gives its newest release with exactly that name that the game can use (a swapper's name gives
; both halves; a SuperCharger brings its vehicle). After the rosters: every creation crystal,
; trap, vehicle, magic item and adventure pack the game can use.
;
; One section per game. The names before = are just labels (the menu sorts by each figure's
; real element). Separate several figures with commas. Spelling, spaces, dashes and capitals
; don't have to match exactly: "jet vac" finds Jet-Vac.
; To pick one release, put its game in front or its series after it: "Trap Team Eon's Elite
; Chop Chop", "SuperChargers Eon's Elite Slam Bam", "Drobot (Series 2)". "Cynder (Series 3)"
; finds Phantom Cynder. "LightCore Smolderdash" and "Smolderdash LightCore" are the same.

