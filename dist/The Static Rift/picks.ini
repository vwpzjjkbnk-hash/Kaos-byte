; My Picks - The Static Rift (Project Kaos-Byte2.0v)
; In the full-screen menu, press R3 (click the right stick) to switch between all figures and
; your picks for the game you're playing. The picks list shows each Skylander named here (its
; newest release with exactly that name that the game can use; a swapper's name gives both
; halves), plus every creation crystal, vehicle, trap, adventure pack and magic item the game
; can use, in the same order as the main list. Every unreleased figure the game can use is
; always in it too, each with the regular figure it's a version of (Instant Food Fight brings
; Food Fight, Special Air Strike brings Air Strike).
;
; One section per game. The names before = are just labels (the menu sorts by each figure's
; real element). Separate several figures with commas. Spelling, spaces, dashes and capitals
; don't have to match exactly: "jet vac" finds Jet-Vac.
; To pick one release, put its game in front or its series after it: "Trap Team Eon's Elite
; Chop Chop", "SuperChargers Eon's Elite Slam Bam", "Drobot (Series 2)". "Cynder (Series 3)"
; finds Phantom Cynder. "LightCore Smolderdash" and "Smolderdash LightCore" are the same.

