; The Static Rift settings (Project Kaos-Byte4.1.0v). Lives in Hdd:\The Static Rift\ (or
; Usb:\The Static Rift\). A folder still called SkyPortal, and skyportal.ini, still work.
; Edit over FTP or on a PC. Takes effect the next time you start a Skylanders game
; (Peer Pressure and Dashlaunch builds alike).

[General]
; 0 = the rift off; the game talks to a real Portal of Power as normal
Enabled = 1
; Toast pop-ups for rift actions
Notifications = 1
; Save the game's progress back into the figure files (a one-time backup goes to The Static Rift\Backups)
SaveWrites = 1
; Keep the same figures on the rift across reboots (stored in rift_state.txt)
RememberPortal = 1
; Report a Traptanium-style speaker. The audio itself is discarded. Leave on unless a game misbehaves.
Speaker = 1
; Swap in (menu or phone): how long the new figure waits after the game has seen the old one come
; off, in milliseconds. 150 is about a quick hand on a real portal (Giants always gets at least 400).
; 0 = as fast as the game takes it; raise it if a game ever hangs right after a swap.
SwapGapMs = 150

[Controls]
; The menu button combo (tap it). Combine with +.
; Names: LB RB LT RT LS RS BACK START A B X Y UP DOWN LEFT RIGHT
Modifier = LB+RB
; Hide the menu buttons from the game while the modifier is held
HideComboFromGame = 1

[Titles]
; The six Xbox 360 Skylanders games are built in. Add extra title IDs (hex) here if needed:
; Extra1 = 41560911
; Dashlaunch build only (with Peer Pressure the SideLoading .ini files pick the games).
; Patch every title that uses the portal API (not recommended: also hits Disney Infinity)
PatchAllTitles = 0

[Startup]
; Figures to put on the rift at boot (file name without extension, or path inside Figures).
; Figure1 = Spyro
; Figure2 = Giants\Tree Rex.bin

[Menu]
; Tap LB+RB to open the full-screen menu; tap LB+RB again (or press BACK) to close it.
;   D-pad left/right  previous / next figure (hold to scroll)
;   D-pad up/down     previous / next section       LT / RT  back / forward 10
;   R3  next list: ALL, MY PICKS (your rosters), then each game's own figures
;   A  put on the rift    B  take off    Y  swap in (only this one on)    X  clear the rift
;   The game doesn't see the controller while the menu is open.
; List only the figures the running game can use: figures work in the game they came out with and
; every later one (Giants lists Spyro's Adventure and Giants figures, and so on; Series 2,
; LightCore and Eon's Elite releases of older characters work back to the character's first game,
; Sidekicks from Trap Team on). 0 = list every figure.
OnlyCompatible = 1
; 0 = the ALL list shows every release of every figure the game can use. 1 = only each
; Skylander's newest release: Tidal Wave Gill Grunt (Series 4) replaces Gill Grunt Series 1-3 and
; their chase, LightCore, Legendary, Eon's Elite and in-game variants (in the games that can use
; him); traps, villains, creation crystals, vehicles, magic items and unreleased figures stay.
NewestOnly = 0
; 1 = the game pauses while the menu is open (every game) and carries on when it closes.
; 0 = the game keeps running behind the menu (but see the next setting).
PauseGame = 1
; When a game leaves too little memory for the menu's own frames (Giants, Swap Force,
; Imaginators), pause the game and draw the menu into the game's own frames, even with
; PauseGame = 0. 0 = never (the console's pop-up menu is used instead when memory runs out).
PauseGameWhenLowOnMemory = 1
; 0 = use the console's pop-up menu instead of the full-screen one (plainer, needs no memory)
FullScreenMenu = 1
; 1 = list figures by type wherever their files are: gimmick Skylanders (Giants, Swappers, Trap
; Masters, SuperChargers, Senseis), Skylanders, creation crystals, traps, vehicles, magic items,
; adventure packs; each by element, then name. 0 = folder by folder, as the files are laid out.
SortByType = 1
; Set to 1 if the menu colours come out wrong (orange instead of blue)
OverlaySwapRedBlue = 0

[Remote]
; The phone remote: while a Skylanders game runs, open the address the
; "Phone remote" pop-up shows (http://<your Xbox's IP>) in a browser on a phone, tablet or PC on
; the same network, and pick figures there. It only works on your home network.
; 0 = off
Enabled = 1
; The port it listens on. 80 means the address is just the IP; when 80 is taken it uses 8080.
Port = 80
